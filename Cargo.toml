[workspace]
members = [
  "crates/lumakit-support",
  "crates/lumakit-observability",
  "crates/lumakit-ai",
  "crates/lumakit-egui",
  "crates/lumakit-gpui",
  "crates/lumakit-design",
  "crates/lumakit-model-picker",
  "crates/lumakit-usage-status",
  "examples/chat-host",
  "examples/lumakit-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lumakit-support = { path = "crates/lumakit-support" }
lumakit-observability = { path = "crates/lumakit-observability" }
lumakit-ai = { path = "crates/lumakit-ai" }
egui = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "links", "system_fonts"] }
lumakit-egui = { path = "crates/lumakit-egui" }
gpui-kit = "=0.9.0"
lumakit-gpui = { path = "crates/lumakit-gpui" }
lumakit-design = { path = "crates/lumakit-design" }
anyhow = "=1.0.104"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "variable-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
zeroize = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
missing_errors_doc = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
